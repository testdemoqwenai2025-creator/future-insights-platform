# =============================================================================
# AETH-1 Platform - Release Workflow
# =============================================================================
# Creates GitHub releases with changelogs
# Tags Docker images for production
# Deploys to production
# Can be triggered manually or via version tags (v*)
# =============================================================================

name: Release Pipeline

on:
  # Trigger on version tags (v1.0.0, v2.1.3, etc.)
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'           # Stable releases: v1.0.0
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.*'     # Beta releases: v1.0.0-beta.1
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.*'       # RC releases: v1.0.0-rc.1
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.*'    # Alpha releases: v1.0.0-alpha.1
  
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - patch      # Bug fixes (1.0.0 -> 1.0.1)
          - minor      # New features (1.0.0 -> 1.1.0)
          - major      # Breaking changes (1.0.0 -> 2.0.0)
          - beta       # Beta release
          - rc         # Release candidate
        default: 'patch'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      generate_changelog:
        description: 'Auto-generate changelog from commits'
        required: false
        type: boolean
        default: true
      create_tag:
        description: 'Create git tag automatically'
        required: false
        type: boolean
        default: true

env:
  BUN_VERSION: '1.1.0'
  NODE_VERSION: '20'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ===========================================================================
  # Job 1: Prepare Release
  # ===========================================================================
  prepare-release:
    name: 📋 Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: 🏷️ Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tag push - extract version from tag
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag=${VERSION}" >> $GITHUB_OUTPUT
            
            # Check if pre-release
            if [[ "$VERSION" == *-* ]]; then
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
            fi
          else
            # Manual workflow dispatch - calculate next version
            CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            CURRENT_VERSION="${CURRENT_VERSION#v}"  # Remove 'v' prefix
            
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            
            case "${{ github.event.inputs.release_type }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
              beta)
                BETA_NUM=$(echo "$CURRENT_VERSION" | grep -oP 'beta\.\K\d+' || echo "0")
                VERSION="${MAJOR}.${MINOR}.${PATCH}-beta.$((BETA_NUM + 1))"
                echo "version=v${VERSION}" >> $GITHUB_OUTPUT
                echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
                echo "is_prerelease=true" >> $GITHUB_OUTPUT
                exit 0
                ;;
              rc)
                RC_NUM=$(echo "$CURRENT_VERSION" | grep -oP 'rc\.\K\d+' || echo "0")
                VERSION="${MAJOR}.${MINOR}.${PATCH}-rc.$((RC_NUM + 1))"
                echo "version=v${VERSION}" >> $GITHUB_OUTPUT
                echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
                echo "is_prerelease=true" >> $GITHUB_OUTPUT
                exit 0
                ;;
            esac
            
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "version=v${NEW_VERSION}" >> $GITHUB_OUTPUT
            echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
            
            if [ "${{ github.event.inputs.prerelease }}" == "true" ]; then
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
            fi
          fi
          
          echo "📌 Version: $(cat $GITHUB_OUTPUT | grep version)"

      - name: 📋 Version summary
        run: |
          echo "## 📋 Release Preparation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ steps.version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pre-release** | ${{ steps.version.outputs.is_prerelease == 'true' && 'Yes ✅' || 'No ❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 2: Run Tests Before Release
  # ===========================================================================
  test:
    name: 🧪 Pre-Release Tests
    runs-on: ubuntu-latest
    needs: prepare-release
    timeout-minutes: 20
    
    env:
      NODE_ENV: test
      DATABASE_URL: file:./release-test.db
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: ⚡ Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-release-test-${{ hashFiles('**/bun.lock') }}

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: 🔧 Generate Prisma client
        run: bunx prisma generate

      - name: 🔎 Run linting
        run: bun run lint

      - name: 🧪 Run tests
        run: bun run test:coverage

      - name: 📊 Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: release-coverage
          path: coverage/
          retention-days: 30

  # ===========================================================================
  # Job 3: Build for Release
  # ===========================================================================
  build:
    name: 🏗️ Build Release
    runs-on: ubuntu-latest
    needs: [prepare-release, test]
    timeout-minutes: 25
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: ⚡ Cache dependencies & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            .next/cache
          key: ${{ runner.os }}-release-build-${{ github.sha }}

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: 🔧 Generate Prisma client
        run: bunx prisma generate

      - name: 🏗️ Build application
        run: bun run build
        env:
          NODE_ENV: production

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeth1-release-${{ needs.prepare-release.outputs.version }}
          path: |
            .next/
            !.next/cache
          retention-days: 30

  # ===========================================================================
  # Job 4: Generate Changelog
  # ===========================================================================
  changelog:
    name: 📝 Generate Changelog
    runs-on: ubuntu-latest
    needs: prepare-release
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.generate_changelog == 'true')
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREVIOUS_TAG}..HEAD"
          fi
          
          # Create changelog file
          cat > CHANGELOG_RELEASE.md << 'EOF'
          ## 🚀 Changelog
          
          EOF
          
          # Add commits by category
          echo "### ✨ Features" >> CHANGELOG_RELEASE.md
          git log $RANGE --pretty=format:"- %s (%h)" --grep="^feat" 2>/dev/null || echo "* No feature changes" >> CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          
          echo "### 🐛 Bug Fixes" >> CHANGELOG_RELEASE.md
          git log $RANGE --pretty=format:"- %s (%h)" --grep="^fix" 2>/dev/null || echo "* No bug fixes" >> CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          
          echo "### 🔧 Other Changes" >> CHANGELOG_RELEASE.md
          git log $RANGE --pretty=format:"- %s (%h)" | grep -vE "^feat|^fix" 2>/dev/null || echo "* No other changes" >> CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          
          cat >> CHANGELOG_RELEASE.md << EOF
          
          ---
          
          ### 📊 Full Commit History
          
          EOF
          
          git log $RANGE --pretty=format:"%h - %s (%an, %ar)" >> CHANGELOG_RELEASE.md 2>/dev/null
          
          echo "Changelog generated:"
          cat CHANGELOG_RELEASE.md

      - name: 📤 Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog-${{ needs.prepare-release.outputs.version }}
          path: CHANGELOG_RELEASE.md
          retention-days: 30

  # ===========================================================================
  # Job 5: Create GitHub Release
  # ===========================================================================
  create-release:
    name: 🎉 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build, changelog]
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog-${{ needs.prepare-release.outputs.version }}
          path: ./

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: aeth1-release-${{ needs.prepare-release.outputs.version }}
          path: ./build-output

      - name: 📦 Create release archive
        run: |
          tar -czvf aeth1-${{ needs.prepare-release.outputs.version }}.tar.gz -C ./build-output .

      - name: 🏷️ Create Git Tag (if manual trigger)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_tag == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.prepare-release.outputs.tag }}';
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha
              });
              console.log(`Created tag: ${tag}`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Tag ${tag} already exists`);
              } else {
                throw e;
              }
            }

      - name: 🎉 Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: "AETH-1 ${{ needs.prepare-release.outputs.version }}"
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: ${{ needs.prepare-release.outputs.is_prerelease == 'true' }}
          files: |
            aeth1-${{ needs.prepare-release.outputs.version }}.tar.gz
            README.md
            LICENSE
            vercel.json
          generate_release_notes: true

      - name: 📋 Release summary
        run: |
          echo "## 🎉 Release Created!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ needs.prepare-release.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release URL** | ${{ steps.release.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pre-release** | ${{ needs.prepare-release.outputs.is_prerelease == 'true' && '✅ Yes' || '❌ No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Assets** | \`aeth1-${{ needs.prepare-release.outputs.version }}.tar.gz\` |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 6: Build and Push Docker Image
  # ===========================================================================
  docker:
    name: 🐳 Publish Docker Image
    runs-on: ubuntu-latest
    needs: [prepare-release, build]
    if: needs.prepare-release.outputs.is_prerelease != 'true'
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔑 Login to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: 📝 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/aeth-1
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/aeth-1', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ needs.prepare-release.outputs.is_prerelease != 'true' }}
            type=sha,prefix=

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.prepare-release.outputs.version }}

      - name: 📋 Docker summary
        run: |
          echo "## 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 7: Deploy to Production (for stable releases only)
  # ===========================================================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: create-release
    if: needs.prepare-release.outputs.is_prerelease != 'true'
    environment:
      name: production
      url: https://aeth-1.vercel.app
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel (Production)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: 📋 Deployment summary
        run: |
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ needs.prepare-release.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ steps.deploy.outputs.preview-url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Notification
  # ===========================================================================
  notify:
    name: 📢 Notify Team
    runs-on: ubuntu-latest
    needs: [create-release, docker, deploy-production]
    if: always()
    
    steps:
      - name: 📢 Send notification
        run: |
          echo "## 🎉 Release Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Prepare | ${{ needs.prepare-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Changelog | ${{ needs.changelog.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Create Release | ${{ needs.create-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
