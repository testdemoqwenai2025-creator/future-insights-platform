# GitHub Pages Alternative: Auto-Deploy Preview
# Deploys your AETH-1 platform preview to FREE hosting on every push

name: 🚀 Deploy Preview

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger from Actions tab

jobs:
  # Option 1: Deploy to Netlify (Free, No Phone Required)
  deploy-netlify:
    runs-on: ubuntu-latest
    name: 🌐 Deploy to Netlify
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline || npm install
        
      - name: 🏗️ Build Static Export
        run: |
          # Create a static preview from our HTML file
          mkdir -p dist
          cp download/AETH-1-FULL-APPLICATION.html dist/index.html
          cp -r public/* dist/ 2>/dev/null || true
          
      - name: 🚀 Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './dist'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployment-message: "Deploy from GitHub main branch"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

  # Option 2: Deploy to Surge.sh (Free Static Hosting)
  deploy-surge:
    runs-on: ubuntu-latest
    name: ⚡ Deploy to Surge.sh
    if: ${{ secrets.SURGE_TOKEN != '' }} # Only runs if token is set
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Preview
        run: |
          mkdir -p preview
          cp download/AETH-1-FULL-APPLICATION.html preview/index.html
          
      - name: 🚀 Deploy to Surge
        uses: surge-sh/action@v1
        with:
          domain: aeth-1-platform.surge.sh
          project: ./preview
          login: ${{ secrets.SURGE_TOKEN }}

  # Option 3: GitHub Artifact (Always works, no setup)
  upload-artifact:
    runs-on: ubuntu-latest
    name: 📦 Upload Preview Artifact
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📦 Create Preview Package
        run: |
          mkdir -p artifact
          cp download/AETH-1-FULL-APPLICATION.html artifact/
          cp -r src/ artifact/src/
          tar -czf aeth-1-preview.tar.gz artifact/
          
      - name: ☁️ Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeth-1-preview
          path: aeth-1-preview.tar.gz
          retention-days: 30

  # Post-deployment notification
  notify:
    runs-on: ubuntu-latest
    name: 📢 Deployment Summary
    needs: [deploy-netlify, upload-artifact]
    if: always()
    
    steps:
      - name: 📋 Summary
        run: |
          echo "## 🚀 AETH-1 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Your Platform is Ready!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Code Repository** | 🔒 Private on GitHub |" >> $GITHUB_STEP_SUMMARY
          echo "| **Preview HTML** | ✅ Included in artifacts |" >> $GITHUB_STEP_SUMMARY
          echo "| **CI/CD Pipeline** | ✅ Running automatically |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Preview Options:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **StackBlitz** (Instant): https://stackblitz.com/github/testdemoqwenai2025-creator/future-insights-platform" >> $GITHUB_STEP_SUMMARY
          echo "2. **CodeSandbox** (Instant): https://codesandbox.io/s/github/testdemoqwenai2025-creator/future-insights-platform" >> $GITHUB_STEP_SUMMARY
          echo "3. **GitHub Codespaces**: Click '<> Code' → 'Codespaces' on repo" >> $GITHUB_STEP_SUMMARY
          echo "4. **Download**: See Artifacts section below" >> $GITHUB_STEP_SUMMARY
