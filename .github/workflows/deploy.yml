name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm install --legacy-peer-deps
          
          echo ""
          echo "Rebuilding native modules (fixing lightningcss)..."
          npm rebuild lightningcss || true
          
          # Verify lightningcss binary exists
          if [ -d "node_modules/lightningcss" ]; then
            echo "Lightningcss files:"
            ls -la node_modules/lightningcss/ 2>/dev/null | head -10
            find node_modules/lightningcss -name "*.node" 2>/dev/null
          fi
      
      - name: Build static export
        id: build
        run: |
          echo "=========================================="
          echo "Starting Next.js Build"
          echo "Node: $(node --version)"
          echo "=========================================="
          
          export NODE_OPTIONS="--max-old-space-size=4096"
          
          # Run build
          npm run build 2>&1 | tee build-output.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          
          echo ""
          echo "Build Exit Code: $BUILD_EXIT_CODE"
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "::error::Build failed"
            tail -50 build-output.log
            exit $BUILD_EXIT_CODE
          fi
          
          # Verify output
          if [ -d "out" ]; then
            echo "✅ SUCCESS! out/ contents:"
            ls -la out/
          else
            echo "::error::out/ not found"
            exit 1
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
