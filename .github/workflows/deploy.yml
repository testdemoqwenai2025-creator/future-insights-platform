name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          echo "Installing with npm install..."
          npm install --legacy-peer-deps --no-optional 2>&1 | tee install.log
          echo "Install exit code: $?"
      
      - name: Build static export
        id: build
        run: |
          echo "=========================================="
          echo "Starting Next.js Build"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Next.js version: $(npx next --version || echo 'unknown')"
          echo "=========================================="
          
          export NODE_OPTIONS="--max-old-space-size=4096"
          
          # Run build with full output
          npm run build 2>&1 | tee build-output.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          
          echo "=========================================="
          echo "Build Exit Code: $BUILD_EXIT_CODE"
          echo "=========================================="
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "::error::Build failed with exit code $BUILD_EXIT_CODE"
            echo "Last 50 lines of build output:"
            tail -50 build-output.log
            exit $BUILD_EXIT_CODE
          fi
          
          # Verify out directory
          if [ -d "out" ]; then
            echo "✅ Build successful! out/ contents:"
            ls -la out/
          else
            echo "::error::Build completed but out/ directory not found"
            exit 1
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
