# =============================================================================
# AETH-1 Platform - Complete CI/CD Pipeline
# =============================================================================
# Automated testing, building, and deployment for Next.js application
# Uses Bun for fast package management and execution
# =============================================================================

name: AETH-1 CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - production
          - staging
          - development
      skip_tests:
        description: 'Skip running tests (use with caution)'
        required: false
        type: boolean
        default: false
      run_migrations:
        description: 'Run database migrations after deployment'
        required: false
        type: boolean
        default: true

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  BUN_VERSION: '1.1.0'
  # Prisma settings
  PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: '1'
  # Application settings for CI
  NEXT_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  # =============================================================================
  # Job 1: Code Quality & Linting
  # =============================================================================
  lint:
    name: 🔍 Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: ⚡ Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: 🔎 Run ESLint
        id: eslint
        run: |
          echo "::group::ESLint Output"
          bun run lint 2>&1 | tee eslint-report.txt
          echo "::endgroup::"
        continue-on-error: true

      - name: 📊 Run TypeScript type check
        id: typescript
        run: |
          echo "::group::TypeScript Check"
          bunx tsc --noEmit --pretty 2>&1 | tee ts-report.txt
          echo "::endgroup::"
        continue-on-error: true

      - name: 📋 Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            eslint-report.txt
            ts-report.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: ✅ Lint summary
        if: always()
        run: |
          echo "## 🔍 Code Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ${{ steps.eslint.outcome }} == 'success' ]; then
            echo "✅ **ESLint**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **ESLint**: Failed or warnings found" >> $GITHUB_STEP_SUMMARY
          fi
          if [ ${{ steps.typescript.outcome }} == 'success' ]; then
            echo "✅ **TypeScript**: No errors" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **TypeScript**: Type errors found" >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # Job 2: Unit Tests
  # =============================================================================
  test-unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ !github.event.inputs.skip_tests }}
    timeout-minutes: 20
    
    env:
      NODE_ENV: test
      DATABASE_URL: file:./test.db
      JWT_SECRET: test-secret-for-ci-cd-pipeline
      NEXTAUTH_SECRET: test-nextauth-secret-for-ci

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: ⚡ Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-test-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: 🔧 Generate Prisma client
        run: bunx prisma generate

      - name: 🧪 Run unit tests with coverage
        id: unit-tests
        run: |
          echo "::group::Unit Tests"
          bun run test:unit -- --coverage --ci --forceExit 2>&1
          echo "::endgroup::"

      - name: 📊 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-report
          path: coverage/
          retention-days: 14

      - name: 📈 Coverage summary
        if: always()
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            echo "## 🧪 Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
          elif [ -d "coverage" ]; then
            echo "## 🧪 Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            ls -la coverage/ >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # Job 3: Integration Tests
  # =============================================================================
  test-integration:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ !github.event.inputs.skip_tests }}
    timeout-minutes: 25
    
    # Use SQLite service for integration tests (matching project's Prisma config)
    services:
      # Note: SQLite is file-based, no container needed
      # But we can add Redis if needed in future
    
    env:
      NODE_ENV: test
      DATABASE_URL: file:./integration-test.db
      JWT_SECRET: test-secret-for-integration-tests
      NEXTAUTH_SECRET: test-nextauth-secret-integration
      TEST_API_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000/api

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: ⚡ Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-integration-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: 🔧 Generate Prisma client
        run: bunx prisma generate

      - name: 💾 Initialize test database
        run: |
          touch ./integration-test.db
          bunx prisma db push --accept-data-loss || echo "Using existing schema"

      - name: 🏗️ Build application for integration tests
        run: bun run build
        env:
          NODE_ENV: production
          DATABASE_URL: file:./integration-test.db

      - name: 🚀 Start application server
        id: start-server
        run: |
          bun run start &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          
          # Wait for server to be ready
          MAX_RETRIES=30
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -sf http://localhost:3000/api/status > /dev/null 2>&1; then
              echo "✅ Server is ready!"
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Waiting for server... ($RETRY_COUNT/$MAX_RETRIES)"
            sleep 2
          done
          
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ Server failed to start within timeout"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          
          echo "server_pid=$SERVER_PID" >> "$GITHUB_OUTPUT"

      - name: 🔗 Run integration tests
        id: integration-tests
        run: |
          echo "::group::Integration Tests"
          bun run test:integration -- --ci --forceExit --verbose 2>&1
          echo "::endgroup::"

      - name: 🛑 Stop server
        if: always()
        run: |
          if [ -n "${{ steps.start-server.outputs.server_pid }}" ]; then
            kill ${{ steps.start-server.outputs.server_pid }} 2>/dev/null || true
          fi
          pkill -f "next-server" 2>/dev/null || true

      - name: 📊 Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            test-results/
            coverage/
          retention-days: 14
          if-no-files-found: ignore

  # =============================================================================
  # Job 4: Build Application
  # =============================================================================
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/develop' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: ⚡ Cache Bun dependencies & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-build-${{ hashFiles('**/bun.lock', '**/package.json', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-bun-build-
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: 🔧 Generate Prisma client
        run: bunx prisma generate

      - name: 🏗️ Build Next.js application
        id: build
        run: |
          echo "::group::Build Output"
          bun run build 2>&1
          echo "::endgroup::"
        env:
          NODE_ENV: production

      - name: 📁 Verify build output
        run: |
          echo "📁 Build artifacts:"
          ls -la .next/
          echo ""
          echo "📄 Standalone output:"
          ls -la .next/standalone/ 2>/dev/null || echo "No standalone output"
          
          # Verify critical files exist
          if [ ! -f ".next/BUILD_ID" ]; then
            echo "❌ BUILD_ID not found - build may have failed"
            exit 1
          fi
          echo "✅ Build verified successfully"

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: |
            .next/
            !.next/cache
          retention-days: 7

      - name: 📋 Build summary
        if: always()
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID:** \`$(cat .next/BUILD_ID 2>/dev/null || echo 'unknown')\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.build.outcome }}" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Job 5: Deploy to Production (Vercel)
  # =============================================================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://aeth-1.vercel.app
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel (Production)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

      - name: ✅ Deployment summary
        if: success()
        run: |
          echo "## 🚀 Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment URL:** ${{ steps.deploy.outputs.preview-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment on commit
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = '${{ steps.deploy.outputs.preview-url }}';
            const body = `## 🚀 Production Deployed Successfully!
            
            | Property | Value |
            |----------|-------|
            | **URL** | ${deployUrl} |
            | **Commit** | \`${context.sha.substring(0, 7)}\` |
            | **Actor** | @${context.actor} |
            | **Time** | ${new Date().toISOString()} |
            
            > Automated deployment from CI/CD pipeline`;
            
            // Try to create a comment on the commit
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: body
              });
            } catch (e) {
              console.log('Could not create commit comment:', e.message);
            }

  # =============================================================================
  # Job 6: Deploy to Staging (develop branch)
  # =============================================================================
  deploy-staging:
    name: 🎭 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.preview-url }}
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel (Staging)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./

  # =============================================================================
  # Job 7: Docker Image Build (for releases)
  # =============================================================================
  docker-build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/aeth-1
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: 📋 Docker image summary
        run: |
          echo "## 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Notification Job
  # =============================================================================
  notify:
    name: 📢 Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always()
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: 🔔 Determine deployment status
        id: status
        run: |
          if [ "${{ needs.deploy-production.result }}" == "success" ] || [ "${{ needs.deploy-staging.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: 📱 Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "${{ steps.status.outputs.emoji }} AETH-1 Deployment ${{ steps.status.outputs.status }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.status.outputs.emoji }} AETH-1 Deployment ${{ steps.status.outputs.status }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Workflow:*\n${{ github.workflow }}" },
                    { "type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}" },
                    { "type": "mrkdwn", "text": "*Actor:*\n${{ github.actor }}" },
                    { "type": "mrkdwn", "text": "*Status:*\n${{ steps.status.outputs.status }}" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: 📮 Send Discord notification
        if: env.DISCORD_WEBHOOK_URL != ''
        uses: sarisia/actions-status-discord@v1.13.1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "${{ steps.status.outputs.emoji }} AETH-1: ${{ steps.status.outputs.status }}"
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          color: ${{ steps.status.outputs.status == 'success' && '0x10b981' || '0xef4444' }}
          username: AETH-1 Bot
        continue-on-error: true

      - name: 📊 Final summary
        if: always()
        run: |
          echo "## 📢 Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test-unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.test-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Production | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Staging | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
